name: Mirror upstream main

on:
  push:
    branches:
      - automation
    paths:
      - .github/workflows/mirror-upstream.yml
  schedule:
    - cron: '17 0 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-upstream-main
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main from upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          upstream_sha="$(git ls-remote https://github.com/happy-loki/codexhub.git refs/heads/main | cut -f1)"
          fork_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"

          echo "upstream main: $upstream_sha"
          echo "fork main:     $fork_sha"

          if [ "$upstream_sha" = "$fork_sha" ]; then
            echo "Already synchronized."
            exit 0
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main

          actual_sha="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"

          if [ "$actual_sha" != "$upstream_sha" ]; then
            echo "Mirror verification failed: expected $upstream_sha, got $actual_sha" >&2
            exit 1
          fi

          echo "Mirror synchronized to $actual_sha"
